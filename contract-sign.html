<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>線上簽約</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--blue:#1d4ed8;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--bg:#f8fafc;--red:#dc2626;--green:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6}
.draft{background:#fef3c7;color:#92400e;font-size:13px;text-align:center;padding:6px 10px;border-bottom:1px solid #fde68a}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;position:sticky;top:0;z-index:5}
header .co{font-size:13px;color:var(--mute)}
header .tt{font-weight:700;font-size:17px}
.steps{display:flex;gap:4px;margin-top:8px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--blue)}
main{padding:16px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px}
.hint{color:var(--mute);font-size:14px}
label{display:block;font-size:14px;color:#334155;margin:12px 0 4px}
label .req{color:var(--red)}
input,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
input.err{border-color:var(--red)}
.errmsg{color:var(--red);font-size:13px;margin-top:4px;min-height:1em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:10px;background:var(--blue);color:#fff;margin-top:16px}
.btn:disabled{background:#94a3b8}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.code{display:flex;gap:10px;justify-content:center;margin:14px 0}
.code input{width:56px;height:60px;text-align:center;font-size:28px;font-weight:700}
.contract{font-size:15px;line-height:1.8;max-height:62vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
.contract h3{font-size:15px;margin:16px 0 4px}
.contract ol{margin:0;padding-left:1.6em}
.contract table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.contract td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.contract td:first-child{width:34%;background:var(--bg);color:#334155}
.scrolltip{font-size:13px;color:var(--mute);text-align:center;margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;margin-left:4px}
.tag.r{background:#fee2e2;color:var(--red)} .tag.o{background:#e2e8f0;color:#475569}
canvas{width:100%;height:200px;border:2px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none;display:block}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--blue);font-size:14px;padding:4px}
.done{text-align:center;padding:30px 10px}
.done .ok{width:72px;height:72px;border-radius:50%;background:#dcfce7;color:var(--green);font-size:40px;line-height:72px;margin:0 auto 12px}
.sum td{padding:4px 6px;font-size:14px;border-bottom:1px solid var(--line)}
.combo{position:relative}
.combo .list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;max-height:260px;overflow-y:auto;z-index:20;box-shadow:0 8px 24px rgba(15,23,42,.12)}
.combo .opt{padding:11px 12px;border-bottom:1px solid #f1f5f9;font-size:15px;cursor:pointer}
.combo .opt:last-child{border-bottom:0}
.combo .opt b{display:inline-block;min-width:38px;color:var(--blue)}
.combo .opt.other{color:var(--mute)}
.combo .none{padding:11px 12px;color:var(--mute);font-size:14px}
.lock{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:14px}
.pv img{width:100%;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:#fff} .doc{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden} .doc summary{padding:12px 14px;font-weight:600;cursor:pointer;background:#f8fafc;list-style:none} .doc .in{padding:12px} .opt-r{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)} .opt-r input{width:22px;height:22px;flex:none} .reasons{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:14px} .reasons label{display:flex;gap:6px;align-items:center;margin:0} .reasons input{width:18px;height:18px} .ok-doc{color:var(--green);font-size:13px;margin-left:6px}</style>
</head>
<body>
<div class="draft" id="draftBar">示範模式・預覽圖為範例資料（林志豪），正式版依實際填寫內容產生</div>
<header><div class="co" id="hCo"></div><div class="tt" id="hTitle"></div><div class="steps" id="steps"></div></header>
<main id="app"></main>
<script>
let PKG = {"name": "蓋世威（信亞派遣・PT 工讀生）", "company": "xinya", "client": "英屬百慕達商蓋世威國際有限公司台灣分公司", "defaults": {"要派公司": "英屬百慕達商蓋世威國際有限公司台灣分公司", "職稱": "工讀生", "時薪": "230", "發薪日": "10", "工作部門": ""}, "documents": [{"file": "1_派遣協議書.docx", "name": "派遣協議書"}, {"file": "2_健保不加保切結書.docx", "name": "健保不加保切結書", "when": {"field": "健保", "in": ["依附父母", "其他單位"]}}, {"file": "3_勞退自願提繳申請表.docx", "name": "勞退自願提繳申請表"}, {"file": "4_離職單.docx", "name": "離職單"}]};
const FB_CONFIG = {apiKey:"AIzaSyCCpbE0XKM-5Oz4NYhPzhqHh7UuYCh5Cvg",authDomain:"recruit-system-904ba.firebaseapp.com",projectId:"recruit-system-904ba",
  storageBucket:"recruit-system-904ba.firebasestorage.app",messagingSenderId:"744257186789",appId:"1:744257186789:web:00cb7069a30903a3521d0c"};
const CT_COL = new URLSearchParams(location.search).get('test')?'test_contracts':'contracts';
const FILE_COL = CT_COL==='test_contracts'?'test_ct_files':'ct_files';
const SERVICE = 'https://pdf-service-744257186789.asia-east1.run.app';
let PREVIEW = {"\u6d3e\u9063\u5354\u8b70\u66f8": [], "\u5065\u4fdd\u4e0d\u52a0\u4fdd\u5207\u7d50\u66f8": [], "\u52de\u9000\u81ea\u9858\u63d0\u7e73\u7533\u8acb\u8868": [], "\u96e2\u8077\u55ae": []};
let REASONS = ["生涯規劃(出國、進修)", "另有他就", "交通因素", "家庭因素", "健康因素", "服役", "不願意任職其他派遣工作", "工作沒有前景", "薪資因素", "工作壓力", "工時太長", "無法配合輪班/加班", "工作性質與興趣／所學不合", "工作場所環境不佳", "主管因素", "同事因素", "工作場所氣氛不佳", "轉換派遣公司", "轉任正職員工"];
function allTags(){return (PKG.documents||[]).flatMap(d=>d.tags||[]);}
function hasTag(prefix){const t=allTags();return !t.length||t.some(x=>x.startsWith(prefix));} // 內建示範沒有欄位資料時全部顯示
/* 示範資料：正式版由簽署連結向伺服器取得（招募人員發送時帶入） */
let C = {contractNo:'XY-20261020-0001', company:'信亞人力派遣股份有限公司', short:'信亞', phoneOffice:'04-2452-6670',
  worker:{name:'林志豪', phone:'0933222111'}, expiresAt:'2026-10-17T14:00',
  job:{要派公司:'英屬百慕達商蓋世威國際有限公司台灣分公司', 職稱:'工讀生', 時薪:'230', 到職日:'2026-10-20', 最後工作日:'2026-10-31', 員工編號:'XY2610001'}};
let LIVE = null; // 由連結開啟時：{id, col}
const S = {step:0, tries:0, data:{name:C.worker.name, phone:C.worker.phone}, opt:{健保:'公司投保', 勞退:'0', 離職原因:[]}, agreed:{}, sig:null};
const STEPS = ['身分確認','填寫資料','選項','閱讀文件','簽名'];
const $ = s=>document.querySelector(s);
const esc = v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roc = d=>{const [y,m,dd]=d.split('-').map(Number);return `${y-1911}/${m}/${dd}`;};
function docs(){return PKG.documents.filter(d=>!d.when||d.when.in.includes(S.opt[d.when.field]));}
function header(){$('#hCo').textContent=C.company;$('#hTitle').textContent='線上簽約：'+C.job.要派公司.replace(/^英屬百慕達商|台灣分公司$/g,'')+' '+C.job.職稱;
  $('#steps').innerHTML=STEPS.map((_,i)=>`<span class="${i<=S.step?'on':''}"></span>`).join('');}
function go(n){S.step=n;header();render();window.scrollTo(0,0);}

/* 1 身分確認 */
function vIdentity(){
  if(S.tries>=5) return `<div class="lock"><b>已鎖定</b><br>手機末 3 碼錯誤次數過多。請聯絡${esc(C.short)}人力 ${esc(C.phoneOffice)}，由專人重新發送連結。</div>`;
  return `<div class="card"><h2>${esc(C.worker.name)} 您好</h2>
    <p>恭喜錄取<b>${esc(C.job.要派公司)}</b> ${esc(C.job.職稱)}（${roc(C.job.到職日)}–${roc(C.job.最後工作日)}）。請在 <b>${C.expiresAt.slice(5,10).replace('-','/')}</b> 前完成線上簽約，共 3～4 份文件（依健保選項），約 5 分鐘。</p>
    <p class="hint">為確認是您本人，請輸入您留給我們的<b>手機號碼末 3 碼</b>${LIVE?'':'（示範：111）'}。</p>
    <div class="code">${[0,1,2].map(i=>`<input id="c${i}" inputmode="numeric" maxlength="1" autocomplete="off">`).join('')}</div>
    <div class="errmsg" id="cErr" style="text-align:center">${S.tries?`末 3 碼不正確，還可以再試 ${5-S.tries} 次`:''}</div>
    <button class="btn" onclick="checkCode()">下一步</button></div>`;
}
function bindIdentity(){[0,1,2].forEach(i=>{const el=$('#c'+i);if(!el)return;el.addEventListener('input',()=>{el.value=el.value.normalize('NFKC').replace(/\D/g,'').slice(0,1);if(el.value&&i<2)$('#c'+(i+1)).focus();});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)$('#c'+(i-1)).focus();});});const f=$('#c0');if(f)f.focus();}
function checkCode(){const v=[0,1,2].map(i=>$('#c'+i).value).join('');if(v.length<3){$('#cErr').textContent='請輸入 3 碼數字';return;}
  if(v===C.worker.phone.slice(-3)){S.last3=v;go(1);return;}S.tries++;render();}

/* ===== 銀行清單（代碼待對照財金公司代碼表確認） ===== */
const BANKS=[
 ['700','中華郵政','郵局 郵政'],['004','臺灣銀行','台銀 台灣銀行'],['005','臺灣土地銀行','土銀 土地'],['006','合作金庫商業銀行','合庫'],
 ['007','第一商業銀行','一銀 第一'],['008','華南商業銀行','華銀 華南'],['009','彰化商業銀行','彰銀 彰化'],['011','上海商業儲蓄銀行','上海 上銀'],
 ['012','台北富邦商業銀行','富邦 北富銀'],['013','國泰世華商業銀行','國泰 世華'],['016','高雄銀行','高銀'],['017','兆豐國際商業銀行','兆豐'],
 ['048','王道商業銀行','王道'],['050','臺灣中小企業銀行','台企銀 企銀'],['052','渣打國際商業銀行','渣打'],['053','台中商業銀行','台中銀 中銀'],
 ['054','京城商業銀行','京城'],['081','滙豐(台灣)商業銀行','匯豐 HSBC'],['101','瑞興商業銀行','瑞興'],['102','華泰商業銀行','華泰'],
 ['103','臺灣新光商業銀行','新光'],['108','陽信商業銀行','陽信'],['118','板信商業銀行','板信'],['147','三信商業銀行','三信'],
 ['803','聯邦商業銀行','聯邦'],['805','遠東國際商業銀行','遠銀 遠東'],['806','元大商業銀行','元大'],['807','永豐商業銀行','永豐'],
 ['808','玉山商業銀行','玉山'],['809','凱基商業銀行','凱基'],['810','星展(台灣)商業銀行','星展 DBS'],['812','台新國際商業銀行','台新'],
 ['816','安泰商業銀行','安泰'],['822','中國信託商業銀行','中信 中國信託'],['823','將來商業銀行','將來 NEXT'],['824','連線商業銀行','LINE Bank 連線'],
 ['826','樂天國際商業銀行','樂天 Rakuten']
];
const OTHER_BANK='其他（農會、信用合作社等）';
const bnorm=x=>String(x||'').toLowerCase().replace(/臺/g,'台').replace(/\s+/g,'');
function bankScore(b,q){
  const [code,name,alias]=b;const n=bnorm(name),a=bnorm(alias);
  if(code.startsWith(q))return 100;
  if(a.split(/(?=[^a-z])|\s/).includes(q)||bnorm(alias).split(' ').includes(q))return 90;
  if(n.includes(q)||a.includes(q))return 80;
  let i=0;for(const ch of n+a){if(ch===q[i])i++;if(i===q.length)return 50;}
  return 0;
}
function bankMatches(raw){
  const q=bnorm(raw);if(!q)return BANKS;
  return BANKS.map(b=>[b,bankScore(b,q)]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]||x[0][0].localeCompare(y[0][0])).map(x=>x[0]);
}
function bankField(){
  const other=S.data.bankOther;
  return `<div class="combo"><input id="f_bank" autocomplete="off" placeholder="${other?'請輸入金融機構名稱':'點選或輸入：郵局、國泰、822…'}" value="${esc(S.data.bank||'')}"
     onfocus="${other?'':'bankOpen()'}" oninput="${other?'':'bankOpen()'}" onblur="setTimeout(bankClose,150)"><div class="list" id="bankList" style="display:none"></div></div>
     ${other?'<button class="linkbtn" onclick="bankReset()">改回從清單選擇</button>':''}`;
}
function bankOpen(){
  const el=$('#f_bank'),box=$('#bankList');S.data.bankCode='';
  const list=bankMatches(el.value);
  box.innerHTML=(list.length?list.map(([c,n])=>`<div class="opt" onpointerdown="event.preventDefault();bankPick('${c}')"><b>${c}</b> ${esc(n)}</div>`).join(''):'<div class="none">找不到，請換個關鍵字，或選「其他」</div>')
    +`<div class="opt other" onpointerdown="event.preventDefault();bankPick('other')">${OTHER_BANK}，自行輸入</div>`;
  box.style.display='';
}
function bankClose(){const b=$('#bankList');if(b)b.style.display='none';}
function bankPick(c){
  keepForm();
  if(c==='other'){S.data.bankOther=true;S.data.bankCode='';S.data.bank='';render();setTimeout(()=>$('#f_bank').focus(),0);return;}
  const b=BANKS.find(x=>x[0]===c);S.data.bankOther=false;S.data.bankCode=c;S.data.bank=`${c} ${b[1]}`;render();
  const n=$('#f_branch');if(n)n.focus();
}
function bankReset(){keepForm();S.data.bankOther=false;S.data.bank='';S.data.bankCode='';render();}
function keepForm(){FIELDS.forEach(([k])=>{const el=$('#f_'+k);if(el&&k!=='bank')S.data[k]=el.value.trim();});}


/* 2 填寫資料（一次填寫，自動帶入全部文件） */
const FIELDS=[
  ['name','姓名',true,'text'],['phone','手機',true,'tel'],
  ['sex','性別',true,'select',['','男','女']],['birthday','出生日期',true,'date'],
  ['idNo','身分證字號',true,'text'],['tel','市話',false,'tel'],['address','通訊地址',true,'text'],['email','電子郵件',false,'email'],
  ['bank','薪資帳戶：銀行／郵局',true,'bank'],['branch','分行',true,'text'],['account','帳號',true,'tel']
];
function vData(){
  const f=([k,l,req,type,opts])=>`<label for="f_${k}">${l}${req?' <span class="req">*</span>':'<span class="hint">（選填）</span>'}</label>`+
    (type==='bank'?bankField():type==='select'?`<select id="f_${k}">${opts.map(o=>`<option ${S.data[k]===o?'selected':''}>${o}</option>`).join('')}</select>`
    :`<input id="f_${k}" type="${type}" value="${esc(S.data[k]||'')}" ${LIVE&&(k==='name'||k==='phone')?'readonly style="background:#f1f5f9"':''} ${k==='idNo'?'autocapitalize="characters" maxlength="10"':''}${k==='account'?' inputmode="numeric" placeholder="只填數字"':''}${k==='branch'?' placeholder="例：台中分行、西屯郵局"':''}>`)+`<div class="errmsg" id="e_${k}"></div>`;
  const by=k=>FIELDS.find(x=>x[0]===k);
  return `<div class="card"><h2>填寫資料</h2><p class="hint">只要填一次，會自動帶入所有簽約文件。${LIVE?'姓名與手機由招募人員設定，如有錯誤請聯絡 '+esc(C.phoneOffice)+'。':''}</p>
    ${f(by('name'))}${f(by('phone'))}<div class="row2"><div>${f(by('sex'))}</div><div>${f(by('birthday'))}</div></div>
    ${f(by('idNo'))}${f(by('tel'))}${f(by('address'))}${f(by('email'))}${f(by('bank'))}<div class="row2"><div>${f(by('branch'))}</div><div>${f(by('account'))}</div></div>
    <button class="btn" onclick="saveData()">下一步</button><button class="btn ghost" onclick="go(0)">返回</button>
    ${LIVE?'':'<button class="btn ghost" onclick="demoFill()">示範用：一鍵填入假資料</button>'}</div>`;
}
function twId(id){
  if(!/^[A-Z][12]\d{8}$/.test(id))return false;
  const L='ABCDEFGHJKLMNPQRSTUVXYWZIO'.indexOf(id[0])+10;
  let s=Math.floor(L/10)+(L%10)*9;const w=[8,7,6,5,4,3,2,1];
  for(let i=1;i<9;i++)s+=+id[i]*w[i-1];
  s+=+id[9];return s%10===0;
}
document.addEventListener('input',e=>{const id=(e.target.id||'');if(id.startsWith('f_')){e.target.classList.remove('err');const m=document.getElementById('e_'+id.slice(2));if(m)m.textContent='';}});
function demoFill(){Object.assign(S.data,{sex:'男',birthday:'2001-03-15',idNo:'B123456780',address:'臺中市西屯區河南路二段262號',bank:'013 國泰世華商業銀行',bankCode:'013',bankOther:false,branch:'西屯分行',account:'123456789012'});render();}
function saveData(){
  let ok=true;
  FIELDS.forEach(([k,l,req])=>{const el=$('#f_'+k);let v=el.value.normalize('NFKC').trim();if(k==='idNo')v=v.toUpperCase();if(['phone','tel','account','idNo'].includes(k))el.value=v;S.data[k]=v;
    let m='';if(req&&!v)m='請填寫'+l;
    else if(k==='idNo'&&!twId(v))m='身分證字號格式不正確';
    else if(k==='phone'&&!/^09\d{8}$/.test(v.replace(/\D/g,'')))m='手機格式不正確';
    else if(k==='bank'&&!S.data.bankOther&&!BANKS.some(b=>`${b[0]} ${b[1]}`===v))m='請從清單點選銀行，或選「其他」自行輸入';
    if(k==='bank'&&!m&&!S.data.bankOther)S.data.bankCode=v.slice(0,3);
    else if(k==='account'){const dgt=v.replace(/[\s-]/g,'');if(!/^\d+$/.test(dgt))m='帳號只能填數字';
      else if(S.data.bankCode==='700'&&dgt.length!==14)m=`郵局帳號應為 14 碼（目前 ${dgt.length} 碼）`;
      else if(S.data.bankCode!=='700'&&(dgt.length<10||dgt.length>16))m=`帳號長度不正確（目前 ${dgt.length} 碼）`;
      else S.data[k]=dgt;}
    $('#e_'+k).textContent=m;el.classList.toggle('err',!!m);if(m)ok=false;});
  if(!ok){const e=document.querySelector('input.err,select.err');if(e)e.scrollIntoView({block:'center'});return;}
  go(2);
}

/* 3 選項：健保、勞退自提、離職原因 */
function vOptions(){
  const r=(v,t)=>`<label class="opt-r"><input type="radio" name="nhi" value="${v}" ${S.opt.健保===v?'checked':''} onchange="S.opt.健保=this.value"><span>${t}</span></label>`;
  const nhi=hasTag('chk:健保'),lp=hasTag('勞退自提'),rs=REASONS.length>0;
  return `${nhi?`<div class="card"><h2>全民健康保險</h2>
    ${r('公司投保','由公司幫我投保健保')}${r('依附父母','依附於父（母），不在公司投保（需簽健保不加保切結書）')}${r('其他單位','已投保於市公所或其他單位（需簽健保不加保切結書）')}</div>`:''}
    ${lp?`<div class="card"><h2>勞工退休金自願提繳</h2><p class="hint">公司每月已提繳 6%；您可以另外自願從薪資提繳 0%–6%。</p>
    <select id="lp" onchange="S.opt.勞退=this.value">${[0,1,2,3,4,5,6].map(n=>`<option value="${n}" ${S.opt.勞退==n?'selected':''}>${n}%${n?'':'（不自願提繳）'}</option>`).join('')}</select></div>`:''}
    ${rs?`<div class="card"><h2>離職申請表</h2><p class="hint">工作期間至 ${roc(C.job.最後工作日)}。請勾選離職原因（可複選，可不勾）。</p>
    <div class="reasons">${REASONS.map((x,i)=>`<label><input type="checkbox" ${S.opt.離職原因.includes(x)?'checked':''} onchange="togR(REASONS[${i}],this.checked)">${esc(x)}</label>`).join('')}</div></div>`:''}
    ${!nhi&&!lp&&!rs?'<div class="card"><h2>選項</h2><p class="hint">這份簽約不需要額外選擇，請按下一步。</p></div>':''}
    <button class="btn" onclick="go(3)">下一步：閱讀文件</button><button class="btn ghost" onclick="go(1)">返回</button>`;
}
/* 文字版文件內容（測試階段，由 Word 範本文字代入資料） */
function vals(){
  const x={...C.job,員工姓名:S.data.name,手機:S.data.phone,市話:S.data.tel||'',身分證字號:S.data.idNo,性別:S.data.sex,通訊地址:S.data.address,Email:S.data.email||'',
    銀行:S.data.bank,分行:S.data.branch,帳號:S.data.account,帳戶說明:`${S.data.bank||''} ${S.data.branch||''} 帳號 ${S.data.account||''}`,
    帳戶類型:S.data.bankCode==='700'?'郵局':'其它',健保:S.opt.健保,勞退自提:S.opt.勞退,離職原因:S.opt.離職原因,生日:S.data.birthday,簽署日:(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;})()};
  ['到職日','最後工作日','生日','簽署日'].forEach(k=>{const v=x[k];if(/^\d{4}-\d{2}-\d{2}$/.test(v||'')){const [y,m,d]=v.split('-').map(Number);x[k+'_民國年']=y-1911;x[k+'_月']=m;x[k+'_日']=d;x[k+'_民國']=`${y-1911}年${m}月${d}日`;}});
  return x;
}
function docText(d){
  const v=vals();
  const line=t=>esc(t).replace(/\{\{([^}]+)\}\}/g,(_,k)=>{k=k.trim();
    if(k.startsWith('chk:')){const [f,w]=k.slice(4).split('=');const h=v[f];return (Array.isArray(h)?h.includes(w):String(h)===w)?'■':'□';}
    if(k==='簽名')return '<span style="color:#1d4ed8">〔簽名處〕</span>';
    const val=v[k];return val===undefined||val===''?'＿＿＿':`<b>${esc(val)}</b>`;});
  return `<div class="contract" style="max-height:50vh">${(d.text||[]).map(t=>`<p style="margin:0 0 6px">${line(t)}</p>`).join('')||'<p class="hint">（無文字內容）</p>'}</div>`;
}
function togR(x,on){const a=S.opt.離職原因.filter(y=>y!==x);if(on)a.push(x);S.opt.離職原因=a;}

/* 4 閱讀文件並逐份同意 */
async function fetchPreview(){
  const key=JSON.stringify([S.data,S.opt]);
  if(S.pv&&S.pvKey===key)return;
  S.pvLoading=true;S.pvErr='';render();
  try{
    const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),90000);
    const r=await fetch(SERVICE+'/preview',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({test:CT_COL==='test_contracts',token:LIVE.ref.id,last3:S.last3,data:S.data,opts:S.opt})});
    clearTimeout(tm);
    const j=await r.json().catch(()=>({ok:false}));
    if(!j.ok)throw new Error(j.error||('預覽產生失敗（'+r.status+'）'));
    S.pv=j.docs;S.pvKey=key;
  }catch(e){console.error(e);S.pv=null;S.pvErr=(e.name==='AbortError'?'文件預覽逾時':'無法產生文件預覽：'+e.message)+'，以下先顯示文字版內容。';}
  S.pvLoading=false;render();
}
function vDocs(){
  const ds=docs();
  if(LIVE&&!S.pvLoading&&!(S.pv&&S.pvKey===JSON.stringify([S.data,S.opt]))&&!S.pvErr)fetchPreview();
  if(S.pvLoading)return `<div class="card done"><div style="font-size:40px">⏳</div><h2>正在產生文件預覽</h2><p class="hint">依您填寫的資料套入契約，約需 10–30 秒，請稍候。</p></div>`;
  return `<div class="card"><h2>閱讀文件（${ds.length} 份）</h2><p class="hint">請點開每份文件閱讀，並勾選同意。${S.pv?'預覽為未簽名版本，簽名後會產生正式 PDF。':''}${S.pvErr?'<br><span style="color:#b45309">'+esc(S.pvErr)+'</span> <button class="linkbtn" onclick="S.pvErr=\'\';render()">重試預覽</button>':''}</p>
    ${ds.map((d,i)=>`<details class="doc" ${i===0?'open':''}><summary>${i+1}. ${esc(d.name)}${S.agreed[d.name]?'<span class="ok-doc">✓ 已同意</span>':''}</summary><div class="in pv">
      ${(()=>{const pv=S.pv&&S.pv.find(x=>x.name===d.name);const imgs=pv&&pv.pages&&pv.pages.length?pv.pages:(PREVIEW[d.name]||[]);return imgs.length?imgs.map(src=>`<img loading="lazy" src="${src}">`).join(''):docText(d);})()}
      <label class="chk"><input type="checkbox" ${S.agreed[d.name]?'checked':''} onchange="S.agreed[docs()[${i}].name]=this.checked;updDocs()"><span>我已閱讀並同意簽署《${esc(d.name)}》</span></label></div></details>`).join('')}
    <button class="btn" id="docNext" onclick="go(4)">下一步：簽名</button><button class="btn ghost" onclick="go(2)">返回</button></div>`;
}
function updDocs(){const ok=docs().every(d=>S.agreed[d.name]);$('#docNext').disabled=!ok;
  document.querySelectorAll('.doc summary').forEach((s,i)=>{const d=docs()[i];s.innerHTML=`${i+1}. ${esc(d.name)}${S.agreed[d.name]?'<span class="ok-doc">✓ 已同意</span>':''}`;});}

/* 5 簽名一次，套用全部文件 */
let pad=null;
function vSign(){
  const ds=docs();
  return `<div class="card"><h2>手寫簽名</h2><p class="hint">請簽下您的姓名：<b>${esc(S.data.name)}</b>。這個簽名會套用到以下 ${ds.length} 份文件：${ds.map(d=>'《'+esc(d.name)+'》').join('')}</p>
    <canvas id="sig"></canvas><div class="sigbar"><span id="sigTip">尚未簽名</span><button class="linkbtn" onclick="pad&&pad.reset()">清除重簽</button></div>
    <button class="btn" id="sendBtn" disabled onclick="submitSign()">送出簽署</button><button class="btn ghost" onclick="go(3)">返回</button></div>`;
}
function bindSign(){
  const cv=$('#sig'),r=window.devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;
  const g=cv.getContext('2d');g.scale(r,r);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#0f172a';
  let drawing=false,len=0,last=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};};
  cv.onpointerdown=e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();len+=Math.hypot(p.x-last.x,p.y-last.y);last=p;
    if(len>150){$('#sendBtn').disabled=false;$('#sigTip').textContent='已簽名';}};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;};
  cv.style.webkitUserSelect='none';cv.style.webkitTouchCallout='none';
  pad={cv,g,reset:()=>{g.clearRect(0,0,cv.width,cv.height);len=0;$('#sendBtn').disabled=true;$('#sigTip').textContent='尚未簽名';}};
}
function clearSig(){pad&&pad.reset();}
async function submitSign(){
  S.sig=pad.cv.toDataURL('image/png');
  if(LIVE){
    const b=$('#sendBtn');b.disabled=true;b.textContent='送出中…';
    b.textContent='產生文件中，約需 10–30 秒…';
    try{
      const r=await fetch(SERVICE+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({test:CT_COL.startsWith('test_'),token:LIVE.ref.id,last3:S.last3,
        data:S.data,opts:S.opt,agreed:Object.keys(S.agreed).filter(k=>S.agreed[k]),signaturePng:S.sig,device:navigator.userAgent})});
      const j=await r.json().catch(()=>({ok:false,error:'伺服器回應錯誤'}));
      if(!j.ok){if(r.status===409){const d2=await LIVE.ref.get().catch(()=>null);if(d2&&d2.exists&&d2.data().status==='signed'){LIVE.pdf=SERVICE+'/pdf?'+(CT_COL.startsWith('test_')?'test=1&':'')+'t='+LIVE.ref.id+'&k='+S.last3;go(5);return;}}throw new Error(j.error||('HTTP '+r.status));}
      LIVE.pdf=SERVICE+'/pdf?'+(CT_COL.startsWith('test_')?'test=1&':'')+'t='+LIVE.ref.id+'&k='+S.last3;
    }catch(e){alert('送出失敗：'+e.message+'\n請稍後再試，或聯絡 '+C.phoneOffice);b.disabled=false;b.textContent='送出簽署';return;}
  }
  go(5);
}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}

function vDone(){
  const ds=docs();const mask=v=>v?v.slice(0,3)+'****'+v.slice(-2):'';
  return `<div class="card done"><div class="ok">✓</div><h2>簽約完成</h2><p>謝謝您！${ds.length} 份文件已完成簽署，可點下方按鈕下載 PDF（建議用外部瀏覽器開啟）。如需協助請聯絡 ${esc(C.phoneOffice)}。</p><p class="hint">簽約編號 ${esc(C.contractNo)}</p>${LIVE&&LIVE.pdf?`<a class="btn" href="${LIVE.pdf}" target="_blank" style="text-decoration:none;text-align:center">📄 下載已簽署文件（PDF）</a>`:''}</div>
    ${LIVE?'':`<div class="card"><h2 style="font-size:16px">示範模式：本次送出內容</h2><table class="sum" style="width:100%">
    <tr><td>姓名</td><td>${esc(S.data.name)}</td></tr><tr><td>身分證字號</td><td>${esc(mask(S.data.idNo))}</td></tr>
    <tr><td>帳戶</td><td>${esc(S.data.bank)} ${esc(S.data.branch)}／${esc(mask(S.data.account))}</td></tr>
    <tr><td>健保</td><td>${esc(S.opt.健保)}</td></tr><tr><td>勞退自提</td><td>${esc(S.opt.勞退)}%</td></tr>
    <tr><td>離職原因</td><td>${esc(S.opt.離職原因.join('、')||'未勾選')}</td></tr>
    <tr><td>簽署文件</td><td>${ds.map(d=>esc(d.name)).join('、')}</td></tr>
    <tr><td>簽名</td><td><img src="${S.sig}" style="max-width:100%;height:70px;border:1px solid var(--line);border-radius:6px"></td></tr></table>
    <button class="btn ghost" onclick="location.reload()">重新示範一次</button></div>`}`;
}
function render(){
  $('#app').innerHTML=[vIdentity,vData,vOptions,vDocs,vSign,vDone][S.step]();
  if(S.step===0)bindIdentity();if(S.step===3)updDocs();if(S.step===4)bindSign();
}
function stopPage(title,msg){document.getElementById('app').innerHTML=`<div class="card done"><h2>${title}</h2><p>${msg}</p></div>`;}
async function boot(){
  const t=new URLSearchParams(location.search).get('t');
  if(!t){header();render();return;}
  document.getElementById('draftBar').textContent='測試版・簽約資料會產生 PDF 並加密存放於台灣機房';
  try{
    firebase.initializeApp(FB_CONFIG);
    const ref=firebase.firestore().collection(CT_COL).doc(t);const snap=await ref.get();
    if(!snap.exists){stopPage('連結無效','找不到這份簽約資料，請聯絡 04-2452-6670。');return;}
    const d=snap.data();
    if(d.status==='void'){stopPage('連結已作廢','請聯絡 04-2452-6670 取得新的簽約連結。');return;}
    if(d.status==='signed'){stopPage('您已完成簽約',`已於 ${(d.signedAt||'').replace('T',' ')} 完成簽署，簽約編號 ${esc(d.contractNo)}。`);return;}
    const expMs=d.expiresTs&&d.expiresTs.toMillis?d.expiresTs.toMillis():(d.expiresAt?Date.parse(d.expiresAt):0);
    if(expMs&&Date.now()>expMs+5*60e3){stopPage('連結已過期','請聯絡 04-2452-6670，由專人重新發送簽約連結。');return;}
    if(!d.pkgSnap||!d.pkgSnap.docs||!d.pkgSnap.docs.length){stopPage('此連結需要重新發送','這份簽約建立時尚未設定文件範本，無法產生文件。請聯絡招募人員重新發送簽約連結（04-2452-6670）。');return;}
    LIVE={ref};
    if(d.pkgSnap&&d.pkgSnap.docs){
      let texts=d.pkgSnap.docs.map(x=>x.text||[]);
      try{const r=await fetch(SERVICE+'/texts?'+(CT_COL==='test_contracts'?'test=1&':'')+'t='+t);const j=await r.json();if(j.ok&&j.docs)texts=d.pkgSnap.docs.map((x,i)=>(j.docs[i]&&j.docs[i].text&&j.docs[i].text.length)?j.docs[i].text:(x.text||[]));}catch(e){console.error(e);}
      PKG={documents:d.pkgSnap.docs.map((x,i)=>({name:x.name,when:x.optional||null,tags:x.tags||[],text:texts[i]}))};PREVIEW={};
      REASONS=[...new Set(allTags().filter(t=>t.startsWith('chk:離職原因=')).map(t=>t.split('=')[1]))];}
    C={contractNo:d.contractNo,company:d.company,short:(d.company||'').slice(0,2),phoneOffice:'04-2452-6670',worker:d.worker,expiresAt:d.expiresAt,job:d.job};
    S.data={name:d.worker.name,phone:d.worker.phone};
    if(!d.openedAt)ref.update({openedAt:nowStr(),status:'opened'}).catch(()=>{});
    header();render();
  }catch(e){console.error(e);stopPage('無法開啟','請稍後再試，或聯絡 04-2452-6670。');}
}
boot();
</script>
